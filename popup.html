<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FC27 FUTBIN 市场监控</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div><strong>FC27 FUTBIN 市场监控</strong><p>PC 报价、最近成交与价格范围</p></div>
    <span id="monitorState" class="badge">0 张</span>
  </header>
  <main>
    <div id="status" role="status" class="status">可以直接添加当前 FUTBIN 卡片开始监控。</div>
    <section class="monitor-panel">
      <div class="section-title">PC 市场监控</div>
      <p id="monitorMessage" class="hint">每张卡只需一个 Market 页；前台不强制刷新，后台每分钟刷新。</p>
      <ol id="monitorPlayers" class="monitor-list"><li class="empty">尚未添加监控卡片</li></ol>
      <div class="actions monitor-actions">
        <button id="browsePlayers">选择新球员</button>
        <button id="bindMonitor">添加当前卡片</button>
      </div>
      <div class="actions monitor-actions">
        <button id="openMonitors">打开全部 Market 页</button>
        <button id="checkMonitor">立即检查并记录</button>
      </div>
      <div class="actions monitor-actions">
        <button id="exportHistory">导出市场记录</button>
        <button id="testNotification">测试通知</button>
      </div>
      <div class="actions monitor-actions">
        <button id="exportBackup">备份监控数据</button>
        <button id="importBackup">恢复监控数据</button>
        <input id="backupFile" type="file" accept=".json,application/json">
      </div>
    </section>
    <details>
      <summary>监控口径与隐私</summary>
      <p>扩展只读取 FUTBIN Market 页已显示的 PC 报价并保存在本机。挂卡数是页面可见的最低五档样本，不是 EA 全市场挂单总数。每张卡只需一个 Market 页；前台不强制刷新，后台每分钟刷新。遇到验证页时不会尝试绕过。</p>
    </details>
  </main>
  <script src="sales-parser.js"></script>
  <script src="monitor-backup.js"></script>
  <script src="popup.js"></script>
</body>
</html>
