<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-label="监控面板简化示意 使用演示数据"><title>监控面板简化示意 使用演示数据</title><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><rect x="0" y="0" width="1100" height="840" rx="8" fill="#edf3f6" stroke="none"/><rect x="26" y="24" width="480" height="790" rx="8" fill="#101923" stroke="none"/><text x="47" y="60" font-size="21" fill="#e8eef7" font-weight="700">FC27 FUTBIN 市场监控</text><text x="47" y="88" font-size="14" fill="#9eb0c3" font-weight="400">PC 报价、最近成交与价格范围</text><rect x="440" y="44" width="43" height="28" rx="8" fill="#173b34" stroke="none"/><text x="448" y="64" font-size="14" fill="#bdebdc" font-weight="400">1 张</text><text x="47" y="128" font-size="17" fill="#e8eef7" font-weight="700">PC 市场监控</text><text x="47" y="154" font-size="14" fill="#9eb0c3" font-weight="400">后台每分钟检查 · 每 15 分钟保存样本</text><rect x="43" y="170" width="446" height="434" rx="8" fill="#172330" stroke="#34475b"/><text x="58" y="199" font-size="18" fill="#e8eef7" font-weight="700">示例球员 A</text><text x="405" y="199" font-size="14" fill="#61d8b7" font-weight="400">监控中</text><text x="58" y="222" font-size="13" fill="#9eb0c3" font-weight="400">88 · 示例版本 · FUTBIN 卡片 ID</text><text x="58" y="253" font-size="23" fill="#61d8b7" font-weight="700">最低价 48,000</text><circle cx="465" cy="247" r="13" fill="#61d8b7"/><text x="460" y="252" font-size="15" fill="#10212a" font-weight="700">1</text><text x="58" y="279" font-size="14" fill="#dbe6f0" font-weight="400">页面报价样本 5 个：2 个与最低价相同</text><text x="58" y="301" font-size="14" fill="#dbe6f0" font-weight="400">另有 2 个比最低价高不超过 5%</text><circle cx="465" cy="294" r="13" fill="#61d8b7"/><text x="460" y="299" font-size="15" fill="#10212a" font-weight="700">2</text><rect x="58" y="316" width="410" height="69" rx="8" fill="#1b3037" stroke="none"/><text x="70" y="338" font-size="14" fill="#bdebdc" font-weight="700">近 15 分钟最低报价：50,000 → 48,000</text><text x="70" y="361" font-size="14" fill="#bdebdc" font-weight="400">预计走势：偏跌迹象（待确认）</text><text x="70" y="379" font-size="12" fill="#9eb0c3" font-weight="400">▸ 判断依据</text><circle cx="465" cy="350" r="13" fill="#61d8b7"/><text x="460" y="355" font-size="15" fill="#10212a" font-weight="700">3</text><text x="58" y="408" font-size="14" fill="#ffcf83" font-weight="400">Latest Sales 最低成交 50,500 · 显示 5 笔</text><text x="58" y="430" font-size="14" fill="#9eb0c3" font-weight="400">EA 价格范围：10,000–100,000</text><circle cx="465" cy="410" r="13" fill="#61d8b7"/><text x="460" y="415" font-size="15" fill="#10212a" font-weight="700">4</text><rect x="58" y="446" width="129" height="34" rx="5" fill="#101923" stroke="#40566c"/><text x="67" y="469" font-size="13" fill="#9eb0c3" font-weight="400">下限（可空）</text><rect x="194" y="446" width="144" height="34" rx="5" fill="#101923" stroke="#40566c"/><text x="204" y="469" font-size="14" fill="#dbe6f0" font-weight="400">50000</text><rect x="346" y="446" width="116" height="34" rx="8" fill="#26384a" stroke="none"/><text x="356" y="469" font-size="14" fill="#dbe6f0" font-weight="400">保存提醒</text><text x="58" y="500" font-size="12" fill="#9eb0c3" font-weight="400">只填最高价表示 ≤ 该价格；清空两项可关闭。</text><circle cx="465" cy="465" r="13" fill="#61d8b7"/><text x="460" y="470" font-size="15" fill="#10212a" font-weight="700">5</text><rect x="59" y="514" width="16" height="16" rx="3" fill="#61d8b7" stroke="none"/><text x="61" y="527" font-size="13" fill="#101923" font-weight="700">✓</text><text x="84" y="528" font-size="13" fill="#ffcf83" font-weight="400">当前最低价低于 Latest Sales 底价时提醒</text><text x="58" y="550" font-size="12" fill="#9eb0c3" font-weight="400">最近检查成功 · 已存 8 条</text><rect x="58" y="561" width="113" height="34" rx="8" fill="#26384a" stroke="none"/><text x="68" y="584" font-size="14" fill="#dbe6f0" font-weight="400">打开 Market</text><rect x="180" y="561" width="65" height="34" rx="8" fill="#26384a" stroke="none"/><text x="190" y="584" font-size="14" fill="#dbe6f0" font-weight="400">移除</text><rect x="43" y="620" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="53" y="643" font-size="14" fill="#dbe6f0" font-weight="400">选择新球员</text><rect x="270" y="620" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="280" y="643" font-size="14" fill="#dbe6f0" font-weight="400">添加当前卡片</text><rect x="43" y="666" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="53" y="689" font-size="14" fill="#dbe6f0" font-weight="400">打开全部 Market 页</text><rect x="270" y="666" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="280" y="689" font-size="14" fill="#dbe6f0" font-weight="400">立即检查并记录</text><rect x="43" y="712" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="53" y="735" font-size="14" fill="#dbe6f0" font-weight="400">导出市场记录</text><rect x="270" y="712" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="280" y="735" font-size="14" fill="#dbe6f0" font-weight="400">测试通知</text><rect x="43" y="758" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="53" y="781" font-size="14" fill="#dbe6f0" font-weight="400">备份监控数据</text><rect x="270" y="758" width="218" height="34" rx="8" fill="#26384a" stroke="none"/><text x="280" y="781" font-size="14" fill="#dbe6f0" font-weight="400">恢复监控数据</text><circle cx="499" cy="735" r="13" fill="#61d8b7"/><text x="494" y="740" font-size="15" fill="#10212a" font-weight="700">6</text><circle cx="553" cy="193" r="13" fill="#61d8b7"/><text x="548" y="198" font-size="15" fill="#10212a" font-weight="700">1</text><text x="580" y="200" font-size="20" fill="#183340" font-weight="700">查看最低报价</text><text x="580" y="229" font-size="16" fill="#45606f" font-weight="400">绿色价格是页面 PC 最低报价。</text><text x="580" y="254" font-size="16" fill="#45606f" font-weight="400">先核对卡片版本和最近检查状态。</text><circle cx="553" cy="303" r="13" fill="#61d8b7"/><text x="548" y="308" font-size="15" fill="#10212a" font-weight="700">2</text><text x="580" y="310" font-size="20" fill="#183340" font-weight="700">判断可见低价层</text><text x="580" y="339" font-size="16" fill="#45606f" font-weight="400">同价与上方 5% 内样本分别展示。</text><text x="580" y="364" font-size="16" fill="#45606f" font-weight="400">最多五个报价，不代表全市场数量。</text><circle cx="553" cy="413" r="13" fill="#61d8b7"/><text x="548" y="418" font-size="15" fill="#10212a" font-weight="700">3</text><text x="580" y="420" font-size="20" fill="#183340" font-weight="700">观察近期变化</text><text x="580" y="449" font-size="16" fill="#45606f" font-weight="400">与约 15 分钟前样本比较。</text><text x="580" y="474" font-size="16" fill="#45606f" font-weight="400">展开“判断依据”查看口径。</text><circle cx="553" cy="523" r="13" fill="#61d8b7"/><text x="548" y="528" font-size="15" fill="#10212a" font-weight="700">4</text><text x="580" y="530" font-size="20" fill="#183340" font-weight="700">对照最近成交与价格范围</text><text x="580" y="559" font-size="16" fill="#45606f" font-weight="400">最近成交仅来自可见 Latest Sales。</text><text x="580" y="584" font-size="16" fill="#45606f" font-weight="400">EA 范围变动会自动提醒。</text><circle cx="553" cy="633" r="13" fill="#61d8b7"/><text x="548" y="638" font-size="15" fill="#10212a" font-weight="700">5</text><text x="580" y="640" font-size="20" fill="#183340" font-weight="700">设置两种价格条件</text><text x="580" y="669" font-size="16" fill="#45606f" font-weight="400">最高价或区间规则需点击保存。</text><text x="580" y="694" font-size="16" fill="#45606f" font-weight="400">成交底价提醒使用独立开关。</text><circle cx="553" cy="743" r="13" fill="#61d8b7"/><text x="548" y="748" font-size="15" fill="#10212a" font-weight="700">6</text><text x="580" y="750" font-size="20" fill="#183340" font-weight="700">检查 记录与迁移</text><text x="580" y="779" font-size="16" fill="#45606f" font-weight="400">CSV 用于分析；JSON 用于恢复。</text><text x="580" y="804" font-size="16" fill="#45606f" font-weight="400">首次安装后可先测试桌面通知。</text></g></svg>