<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-label="安装 添加卡片 设置提醒 保持页面打开 收到提醒后核实"><title>安装 添加卡片 设置提醒 保持页面打开 收到提醒后核实</title><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><rect x="0" y="0" width="1100" height="220" rx="8" fill="#edf3f6" stroke="none"/><rect x="20" y="36" width="190" height="150" rx="12" fill="#ffffff" stroke="#d2e0e5"/><circle cx="48" cy="65" r="13" fill="#61d8b7"/><text x="43" y="70" font-size="15" fill="#10212a" font-weight="700">1</text><text x="35" y="107" font-size="18" fill="#183340" font-weight="700">安装扩展</text><text x="35" y="142" font-size="13" fill="#45606f" font-weight="400">加载根目录并固定图标</text><text x="216" y="118" font-size="21" fill="#6a8793" font-weight="400">→</text><rect x="238" y="36" width="190" height="150" rx="12" fill="#ffffff" stroke="#d2e0e5"/><circle cx="266" cy="65" r="13" fill="#61d8b7"/><text x="261" y="70" font-size="15" fill="#10212a" font-weight="700">2</text><text x="253" y="107" font-size="18" fill="#183340" font-weight="700">添加卡片</text><text x="253" y="142" font-size="13" fill="#45606f" font-weight="400">核对评分和版本</text><text x="434" y="118" font-size="21" fill="#6a8793" font-weight="400">→</text><rect x="456" y="36" width="190" height="150" rx="12" fill="#ffffff" stroke="#d2e0e5"/><circle cx="484" cy="65" r="13" fill="#61d8b7"/><text x="479" y="70" font-size="15" fill="#10212a" font-weight="700">3</text><text x="471" y="107" font-size="18" fill="#183340" font-weight="700">设置提醒</text><text x="471" y="142" font-size="13" fill="#45606f" font-weight="400">保存价格规则与开关</text><text x="652" y="118" font-size="21" fill="#6a8793" font-weight="400">→</text><rect x="674" y="36" width="190" height="150" rx="12" fill="#ffffff" stroke="#d2e0e5"/><circle cx="702" cy="65" r="13" fill="#61d8b7"/><text x="697" y="70" font-size="15" fill="#10212a" font-weight="700">4</text><text x="689" y="107" font-size="18" fill="#183340" font-weight="700">保持页面打开</text><text x="689" y="142" font-size="13" fill="#45606f" font-weight="400">后台检查并累积历史</text><text x="870" y="118" font-size="21" fill="#6a8793" font-weight="400">→</text><rect x="892" y="36" width="190" height="150" rx="12" fill="#ffffff" stroke="#d2e0e5"/><circle cx="920" cy="65" r="13" fill="#61d8b7"/><text x="915" y="70" font-size="15" fill="#10212a" font-weight="700">5</text><text x="907" y="107" font-size="18" fill="#183340" font-weight="700">收到提醒后核实</text><text x="907" y="142" font-size="13" fill="#45606f" font-weight="400">打开页面再确认行情</text></g></svg>